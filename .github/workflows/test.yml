name: R core tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.4'
      - name: Locate and test skill
        shell: bash
        run: |
          if [ -f skills/gbd-burden-analysis/tests/test_core.R ]; then
            cd skills/gbd-burden-analysis
          fi
          Rscript --vanilla scripts/check_dependencies.R core
          Rscript --vanilla tests/test_core.R
